name: Collect 14:30 index snapshot
on:
  schedule:
    # UTC 06:23 = Asia/Shanghai 14:23; warm up then wait for 14:30.
    - cron: '23 6 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-index-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Run offline gates
        run: python -m pytest -q
      - name: Collect (publishes explicit failure when stale or unavailable)
        id: capture
        continue-on-error: true
        run: python -m etf_assistant.cli collect --wait --retry-window --evidence reports/live-raw.json
      - name: Generate public Action schema
        if: always() && steps.capture.outcome != 'skipped'
        env:
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.event.repository.default_branch }}
        run: python scripts/make_openapi.py "https://raw.githubusercontent.com/${REPO_SLUG}/${REF_NAME}/public/latest.json"
      - name: Publish JSON with built-in repository token
        if: always() && steps.capture.outcome != 'skipped'
        run: |
          test -f public/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/latest.json public/archive/ public/openapi.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated index snapshot"
            git push
          fi
      - name: Verify anonymous public HTTPS read
        if: always() && steps.capture.outcome != 'skipped'
        env:
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.event.repository.default_branch }}
        run: |
          for attempt in 1 2 3; do
            if python -m etf_assistant.cli verify-url "https://raw.githubusercontent.com/${REPO_SLUG}/${REF_NAME}/public/latest.json" --expected public/latest.json --output public/verification.json; then
              break
            fi
            sleep 10
          done
          python -c "import json; assert json.load(open('public/verification.json'))['public_https_verified']"
      - name: Publish verification result
        if: always() && steps.capture.outcome != 'skipped'
        run: |
          test -f public/verification.json
          git add -f public/verification.json
          if ! git diff --cached --quiet; then
            git commit -m "Record public HTTPS verification"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-evidence-${{ github.run_id }}
          path: |
            reports/
            public/
          retention-days: 14
      - name: Mark invalid collection as failed
        if: steps.capture.outcome == 'failure'
        run: exit 2
