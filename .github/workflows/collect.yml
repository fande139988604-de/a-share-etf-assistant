name: Collect 14:30 index snapshot
on:
  schedule:
    # UTC 05:17 = Beijing 13:17; observed delays were 29-55 minutes.
    # Prepare early then wait for exchange time. Schedule is not an SLA.
    - cron: '17 5 * * 1-5'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collect.yml'
      - 'etf_assistant/**'
      - 'scripts/prepare_publication.py'
      - 'scripts/render_snapshot.py'
      - 'scripts/make_openapi.py'
      - 'scripts/check_delivery.py'
      - 'scripts/collect_market_evidence.py'
      - 'scripts/build_market_evidence.py'
      - 'scripts/render_market_evidence.py'
      - 'config/catalysts.json'
      - 'schemas/**'
      - 'requirements.lock.txt'
      - 'pyproject.toml'
permissions:
  contents: write
concurrency:
  group: publish-index-snapshot
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      pages_ready: ${{ steps.pages-artifact.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - name: Run offline gates
        run: python -m pytest -q
      - name: Record run start
        id: clock
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Collect public market evidence before capture window
        continue-on-error: true
        run: python scripts/collect_market_evidence.py --output reports/market-input.json
      - name: Append evidence ledger and render trend observations
        id: research
        run: python scripts/build_market_evidence.py --input reports/market-input.json
      - name: Collect with time reserved for publishing
        id: capture
        continue-on-error: true
        run: python -m etf_assistant.cli collect --wait --retry-window --capture-seconds 120 --output reports/staged-public/latest.json --evidence reports/live-raw.json
      - name: Validate this run and prepare JSON and HTML
        id: prepare
        if: always() && steps.capture.outcome != 'skipped'
        env:
          STARTED_AT: ${{ steps.clock.outputs.started_at }}
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.event.repository.default_branch }}
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          python scripts/prepare_publication.py --source reports/staged-public/latest.json --started-at "$STARTED_AT"
          python scripts/make_openapi.py "${PAGES_BASE}/latest.json"
      - name: Publish JSON with built-in repository token
        id: publish
        if: always() && steps.prepare.outcome == 'success'
        run: |
          test -f public/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/latest.json public/archive/ public/openapi.json public/snapshot.html
          git add -f public/market-evidence.json public/market-evidence.html public/research/
          if ! git diff --cached --quiet; then
            git commit -m "Publish validated index snapshot"
            # The main branch may advance while this job waits for 14:30.
            # Rebase only our generated-publication commit; conflicts fail closed.
            git pull --rebase origin ${{ github.event.repository.default_branch }}
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - name: Verify anonymous public HTTPS read
        if: always() && steps.publish.outcome == 'success'
        env:
          REPO_SLUG: ${{ github.repository }}
          REF_NAME: ${{ github.event.repository.default_branch }}
        run: |
          for attempt in 1 2 3; do
            if python -m etf_assistant.cli verify-url "https://raw.githubusercontent.com/${REPO_SLUG}/${REF_NAME}/public/latest.json" --expected public/latest.json --output reports/raw-verification.json; then
              break
            fi
            sleep 5
          done
          python -c "import json; assert json.load(open('reports/raw-verification.json'))['public_https_verified']"
          cp reports/raw-verification.json public/verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: collection-evidence-${{ github.run_id }}
          path: |
            reports/
            public/
          retention-days: 14
      - name: Prepare public JSON hosting
        id: pages-artifact
        if: always() && steps.publish.outcome == 'success'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Mark invalid collection as failed
        if: steps.capture.outcome == 'failure'
        run: exit 2
  pages:
    needs: collect
    if: always() && needs.collect.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: collection-evidence-${{ github.run_id }}
          path: verification-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests jsonschema tzdata
      - name: Verify deployed JSON and HTML and delivery freshness
        env:
          PAGES_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          for endpoint in latest.json snapshot.html; do
            passed=false
            for attempt in 1 2 3; do
              if python -m etf_assistant.cli verify-url "$PAGES_BASE/$endpoint" --expected verification-input/public/latest.json --output "reports/pages-$endpoint.json"; then
                passed=true
                break
              fi
              sleep 5
            done
            test "$passed" = true
          done
          python scripts/check_delivery.py verification-input/public/latest.json reports/pages-latest.json.json reports/pages-snapshot.html.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pages-verification-${{ github.run_id }}
          path: reports/pages-*.json
          retention-days: 14
