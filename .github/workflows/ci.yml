name: Offline checks
on:
  push:
    paths-ignore: ['public/**', 'reports/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q --junitxml=reports/offline-ci.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-tests
          path: reports/offline-ci.xml
